<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Blood Glow Night</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =================================================
     ФОНОВЫЕ ЗВУКИ
================================================= -->

<audio id="phoneAudio"
       src="sounds/phone.mp3"
       preload="auto"></audio>

<audio id="humAudio"
       src="sounds/hum.mp3"
       preload="auto"
       loop></audio>

<audio id="flashAudio"
       src="sounds/flash.mp3"
       preload="auto"></audio>

<audio id="lichiAudio"
       src="sounds/lichi_scream.mp3"
       preload="auto"></audio>

<audio id="ventAudio"
       src="sounds/vent.mp3"
       preload="auto"
       loop></audio>


<!-- =================================================
     ГЛАВНОЕ МЕНЮ
================================================= -->

<div id="mainMenu" class="screen">

    <div class="menuBox">

        <h1>BLOOD GLOW NIGHT</h1>

        <button id="startGameButton">
            НАЧАТЬ НОЧЬ
        </button>

        <button id="nightsButton">
            НОЧИ
        </button>

        <button id="settingsButton">
            НАСТРОЙКИ
        </button>

        <button id="fullscreenButton">
            ПОЛНЫЙ ЭКРАН
        </button>

    </div>

</div>


<!-- =================================================
     МЕНЮ НОЧЕЙ
================================================= -->

<div id="nightsMenu"
     class="screen"
     style="display:none;">

    <div class="menuBox">

        <h2>ВЫБОР НОЧИ</h2>

        <div id="nightsList"></div>

        <button id="closeNights">
            НАЗАД
        </button>

    </div>

</div>


<!-- =================================================
     НАСТРОЙКИ
================================================= -->

<div id="settingsMenu"
     class="screen"
     style="display:none;">

    <div class="menuBox">

        <h2>НАСТРОЙКИ</h2>

        <button id="fullscreenSetting">
            ПОЛНЫЙ ЭКРАН
        </button>

        <button id="resetProgress">
            СБРОСИТЬ ПРОГРЕСС
        </button>

        <button id="closeSettings">
            НАЗАД
        </button>

    </div>

</div>


<!-- =================================================
     ТЕЛЕФОННЫЙ ЗВОНОК
================================================= -->

<div id="phoneScreen"
     class="screen"
     style="display:none;">

    <div class="phoneBox">

        <h2>12:00 AM</h2>

        <p>
            ВХОДЯЩИЙ ЗВОНОК...
        </p>

        <button id="skipPhoneButton">
            ПРОПУСТИТЬ ЗВОНОК
        </button>

    </div>

</div>


<!-- =================================================
     ИГРА
================================================= -->

<div id="game"
     style="display:none;">

    <div id="background"></div>

    <!-- Основной экран -->
    <div id="view">

        <img id="lichi"
             src="images/lichi.png"
             alt="Lichi">

    </div>


    <!-- Верхняя панель -->

    <div id="topBar">

        <div id="night">
            NIGHT 1
        </div>

        <div id="time">
            12:00 AM
        </div>

    </div>


    <!-- Статус -->

    <div id="status">
        ОФИС
    </div>


    <!-- Управление обзором -->

    <div id="viewControls">

        <button id="leftButton">
            ◀
        </button>

        <button id="frontButton">
            ●
        </button>

        <button id="rightButton">
            ▶
        </button>

    </div>


    <!-- Нижняя панель -->

    <div id="bottomControls">

        <button id="cameraButton">
            КАМЕРЫ
        </button>

        <button id="ventButton">
            ВЕНТИЛЯЦИЯ
        </button>

        <button id="flashButton">
            ВСПЫШКА
        </button>

    </div>


    <!-- =================================================
         ПАНЕЛЬ КАМЕР
    ================================================= -->

    <div id="cameraPanel">

        <div class="panelHeader">

            <span>КАМЕРЫ</span>

            <button id="closeCameraPanel">
                X
            </button>

        </div>


        <div id="cameraContent">

            <div id="cameraImage">

                <!-- картинка камеры -->
                <div id="cameraLichi"></div>

            </div>


            <div id="cameraMap">

                <button data-camera="cam01">
                    CAM 01
                </button>

                <button data-camera="cam02">
                    CAM 02
                </button>

                <button data-camera="cam03">
                    CAM 03
                </button>

                <button data-camera="cam04">
                    CAM 04
                </button>

                <button data-camera="cam05">
                    CAM 05
                </button>

                <button data-camera="cam06">
                    CAM 06
                </button>

                <button data-camera="cam07">
                    CAM 07
                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         ПАНЕЛЬ ВЕНТИЛЯЦИИ
    ================================================= -->

    <div id="ventPanel">

        <div class="panelHeader">

            <span>ВЕНТИЛЯЦИЯ</span>

            <button id="closeVentPanel">
                X
            </button>

        </div>


        <div id="ventContent">

            <div id="ventImage">

                <div id="ventLichi"></div>

            </div>


            <!-- Карта вентиляции -->

            <div id="ventMap">

                <div class="ventNode">
                    V1
                </div>

                <div class="ventLine">
                    ↓
                </div>

                <div class="ventNode">
                    V2
                </div>

                <div class="ventLine">
                    ↓
                </div>

                <div class="ventNode">
                    V3
                </div>

                <div class="ventLine">
                    ↓
                </div>

                <div class="ventNode">
                    OFFICE
                </div>

            </div>


            <!-- Перегородки -->

            <div id="barriers">

                <button
                    class="barrier"
                    data-barrier="1">

                    ПЕРЕГОРОДКА 1
                    <span>ОТКРЫТА</span>

                </button>


                <button
                    class="barrier"
                    data-barrier="2">

                    ПЕРЕГОРОДКА 2
                    <span>ОТКРЫТА</span>

                </button>


                <button
                    class="barrier"
                    data-barrier="3">

                    ПЕРЕГОРОДКА 3
                    <span>ОТКРЫТА</span>

                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         ВСПЫШКА
    ================================================= -->

    <div id="flash"></div>


    <!-- =================================================
         GAME OVER
    ================================================= -->

    <div id="gameOver"
         class="overlay"
         style="display:none;">

        <div class="gameOverBox">

            <h1>GAME OVER</h1>

            <p>
                ЛИЧИ ДОБРАЛАСЬ ДО ТЕБЯ
            </p>

            <button id="restart">
                ЗАНОВО
            </button>

            <button id="menuAfterLose">
                МЕНЮ
            </button>

        </div>

    </div>


    <!-- =================================================
         ПОБЕДА
    ================================================= -->

    <div id="winScreen"
         class="overlay"
         style="display:none;">

        <div class="gameOverBox">

            <h1 id="winText">
                NIGHT COMPLETE
            </h1>

            <button id="nextNight">
                СЛЕДУЮЩАЯ НОЧЬ
            </button>

            <button id="menuAfterWin">
                МЕНЮ
            </button>

        </div>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Blood Glow Night</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =================================================
     ГЛАВНОЕ МЕНЮ
================================================= -->

<div id="mainMenu">

    <h1>BLOOD GLOW NIGHT</h1>

    <button id="startGameButton">
        НАЧАТЬ НОЧЬ
    </button>

    <button id="nightsButton">
        НОЧИ
    </button>

    <button id="settingsButton">
        НАСТРОЙКИ
    </button>

</div>


<!-- =================================================
     ВЫБОР НОЧИ
================================================= -->

<div id="nightsMenu">

    <div class="menuWindow">

        <h2>ВЫБОР НОЧИ</h2>

        <div id="nightsList"></div>

        <button id="closeNights">
            НАЗАД
        </button>

    </div>

</div>


<!-- =================================================
     НАСТРОЙКИ
================================================= -->

<div id="settingsMenu">

    <div class="menuWindow">

        <h2>НАСТРОЙКИ</h2>

        <button id="fullscreenButton">
            ПОЛНЫЙ ЭКРАН
        </button>

        <button id="resetProgress">
            СБРОСИТЬ ПРОГРЕСС
        </button>

        <button id="closeSettings">
            НАЗАД
        </button>

    </div>

</div>


<!-- =================================================
     ТЕЛЕФОННЫЙ ЗВОНОК
================================================= -->

<div id="phoneScreen">

    <div class="phoneWindow">

        <h2>12:00 AM</h2>

        <p>ВХОДЯЩИЙ ЗВОНОК...</p>

        <button id="skipPhoneButton">
            ПРОПУСТИТЬ ЗВОНОК
        </button>

    </div>

</div>


<!-- =================================================
     ИГРА
================================================= -->

<div id="game">

    <div id="hud">

        <div id="night">
            NIGHT 1
        </div>

        <div id="time">
            12:00 AM
        </div>

    </div>


    <!-- ОФИС -->

    <div id="view">

        <img
            id="lichi"
            src="images/lichi.png"
            alt="Lichi"
        >

        <div id="flash"></div>

    </div>


    <!-- СТАТУС -->

    <div id="status">
        ОФИС
    </div>


    <!-- ПОВОРОТЫ -->

    <div id="officeControls">

        <button id="leftButton">
            ◀
        </button>

        <button id="frontButton">
            ●
        </button>

        <button id="rightButton">
            ▶
        </button>

    </div>


    <!-- НИЖНИЕ КНОПКИ -->

    <div id="bottomControls">

        <button id="cameraButton">
            КАМЕРЫ
        </button>

        <button id="flashButton">
            ВСПЫШКА
        </button>

    </div>


    <!-- =================================================
         МОНИТОР КАМЕР
    ================================================= -->

    <div id="cameraPanel">

        <div id="cameraHeader">

            <button id="cameraTabButton">
                КАМЕРЫ
            </button>

            <button id="ventTabButton">
                ВЕНТИЛЯЦИЯ
            </button>

            <button id="closeCameraPanel">
                ОПУСТИТЬ
            </button>

        </div>


        <!-- =========================
             КАМЕРЫ
        ========================== -->

        <div id="cameraContent">

            <div id="cameraScreen">

                <!--
                    КАРТИНКА КАМЕРЫ
                    появляется здесь
                -->

                <img
                    id="cameraImage"
                    src="images/cam01.png"
                    alt="Camera"
                >

                <!-- Личи поверх картинки -->

                <img
                    id="cameraLichi"
                    src="images/lichi.png"
                    alt="Lichi"
                >

                <div id="cameraName">
                    CAM 01
                </div>

            </div>


            <!-- СПИСОК КАМЕР -->

            <div id="cameraList">

                <button data-camera="cam01">
                    CAM 01
                </button>

                <button data-camera="cam02">
                    CAM 02
                </button>

                <button data-camera="cam03">
                    CAM 03
                </button>

                <button data-camera="cam04">
                    CAM 04
                </button>

                <button data-camera="cam05">
                    CAM 05
                </button>

                <button data-camera="cam06">
                    CAM 06
                </button>

                <button data-camera="cam07">
                    CAM 07
                </button>

            </div>

        </div>


        <!-- =========================
             ВЕНТИЛЯЦИЯ
        ========================== -->

        <div id="ventContent">

            <div id="ventMap">

                <div class="ventLine line1"></div>
                <div class="ventLine line2"></div>
                <div class="ventLine line3"></div>
                <div class="ventLine line4"></div>

                <div class="ventPoint"
                     id="vent1">
                    V-01
                </div>

                <div class="ventPoint"
                     id="vent2">
                    V-02
                </div>

                <div class="ventPoint"
                     id="vent3">
                    V-03
                </div>

                <div class="ventPoint"
                     id="vent4">
                    V-04
                </div>

                <div class="ventPoint"
                     id="ventOffice">
                    OFFICE
                </div>

            </div>

            <div id="ventStatus">
                ВЕНТИЛЯЦИЯ
            </div>

        </div>

    </div>

</div>


<!-- =================================================
     GAME OVER
================================================= -->

<div id="gameOver">

    <div class="resultWindow">

        <h1>GAME OVER</h1>

        <p>
            ЛИЧИ ДОБРАЛАСЬ ДО ОФИСА
        </p>

        <button id="restart">
            ПОВТОРИТЬ
        </button>

        <button id="menuAfterLose">
            МЕНЮ
        </button>

    </div>

</div>


<!-- =================================================
     ПОБЕДА
================================================= -->

<div id="winScreen">

    <div class="resultWindow">

        <h1 id="winText">
            NIGHT COMPLETE
        </h1>

        <button id="nextNight">
            СЛЕДУЮЩАЯ НОЧЬ
        </button>

        <button id="menuAfterWin">
            МЕНЮ
        </button>

    </div>

</div>


<!-- =================================================
     ЗВУКИ
================================================= -->

<audio id="phoneAudio"
       src="sounds/phone.mp3"
       preload="auto">
</audio>

<audio id="flashAudio"
       src="sounds/flash.mp3"
       preload="auto">
</audio>

<audio id="lichiAudio"
       src="sounds/lichi.mp3"
       preload="auto">
</audio>

<audio id="humAudio"
       src="sounds/hum.mp3"
       preload="auto"
       loop>
</audio>


<script src="game.js"></script>

</body>
                     </html>

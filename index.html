<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Blood Glow Night</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     ГЛАВНОЕ МЕНЮ
========================= -->

<div id="mainMenu" class="screen">

    <div class="menuBackground"></div>

    <div class="menuContent">

        <h1>BLOOD GLOW NIGHT</h1>

        <button id="startGameButton">
            НОВАЯ НОЧЬ
        </button>

        <button id="nightsButton">
            НОЧИ
        </button>

        <button id="settingsButton">
            НАСТРОЙКИ
        </button>

    </div>

</div>


<!-- =========================
     ВЫБОР НОЧИ
========================= -->

<div id="nightsMenu" class="screen hidden">

    <div class="menuContent">

        <h2>ВЫБОР НОЧИ</h2>

        <div id="nightsList"></div>

        <button id="closeNights">
            НАЗАД
        </button>

    </div>

</div>


<!-- =========================
     НАСТРОЙКИ
========================= -->

<div id="settingsMenu" class="screen hidden">

    <div class="menuContent">

        <h2>НАСТРОЙКИ</h2>

        <button id="fullscreenButton">
            ПОЛНЫЙ ЭКРАН
        </button>

        <button id="resetProgress">
            СБРОСИТЬ ПРОГРЕСС
        </button>

        <button id="closeSettings">
            НАЗАД
        </button>

    </div>

</div>


<!-- =========================
     ТЕЛЕФОН
========================= -->

<div id="phoneScreen" class="screen hidden">

    <div class="phoneBox">

        <h2 id="phoneNight">
            NIGHT 1
        </h2>

        <p>
            Входящий звонок...
        </p>

        <button id="skipPhoneButton">
            ПРОПУСТИТЬ ЗВОНОК
        </button>

    </div>

</div>


<!-- =========================
     ИГРА
========================= -->

<div id="game" class="hidden">

    <div id="background"></div>

    <div id="view">

        <img id="lichi"
             src="images/lichi.png"
             alt="Личи">

        <img id="pancake"
             src="images/pancake.png"
             alt="Панкейк">

        <div id="flash"></div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div id="night">
            NIGHT 1
        </div>

        <div id="time">
            12:00 AM
        </div>

    </div>


    <div id="status">
        ОФИС
    </div>


    <!-- ПОВОРОТЫ -->

    <div id="officeControls">

        <button id="leftButton">
            ◀
        </button>

        <button id="frontButton">
            ●
        </button>

        <button id="rightButton">
            ▶
        </button>

    </div>


    <!-- РЫЧАГ ПОД СТОЛОМ -->

    <button id="leverButton"
            class="leverButton">

        <img src="images/lever.png"
             alt="Рычаг">

    </button>


    <!-- НИЖНИЕ КНОПКИ -->

    <div id="bottomControls">

        <button id="cameraButton">
            КАМЕРЫ
        </button>

        <button id="flashButton">
            ВСПЫШКА
        </button>

    </div>


    <!-- =========================
         КАМЕРЫ
    ========================== -->

    <div id="cameraPanel"
         class="panel hidden">

        <div class="panelHeader">

            <span>
                СИСТЕМА КАМЕР
            </span>

            <button id="closeCameraPanel">
                ✕
            </button>

        </div>


        <div id="cameraImage">

            <div id="cameraStatic"></div>

            <div id="cameraNumber">
                CAM 01
            </div>

            <img id="cameraLichi"
                 src="images/lichi.png"
                 alt="Личи">

            <img id="cameraPancake"
                 src="images/pancake.png"
                 alt="Панкейк">

        </div>


        <!-- ВЕРТИКАЛЬНЫЙ СПИСОК КАМЕР -->

        <div id="cameraMap">

            <button data-camera="cam01">
                CAM 01
            </button>

            <button data-camera="cam02">
                CAM 02
            </button>

            <button data-camera="cam03">
                CAM 03
            </button>

            <button data-camera="cam04">
                CAM 04
            </button>

            <button data-camera="cam05">
                CAM 05
            </button>

            <button data-camera="cam06">
                CAM 06
            </button>

            <button data-camera="cam07">
                CAM 07
            </button>

        </div>

    </div>


    <!-- =========================
         ПЕРЕНАПРАВЛЕНИЕ ЭЛЕКТРИЧЕСТВА
    ========================== -->

    <div id="powerPanel"
         class="panel hidden">

        <div class="panelHeader">

            <span>
                ПЕРЕНАПРАВЛЕНИЕ ЭЛЕКТРИЧЕСТВА
            </span>

            <button id="closePowerPanel">
                ✕
            </button>

        </div>


        <div id="powerContent">

            <div id="powerLeverVisual">

                <img src="images/lever.png"
                     alt="Рычаг">

            </div>


            <div id="powerStatus">
                ЭЛЕКТРИЧЕСТВО: ОФИС
            </div>


            <p id="powerDescription">
                Выберите, куда перенаправить электричество.
            </p>


            <div id="powerChoices">

                <button
                    class="powerChoice"
                    data-power="window">

                    ⚡ ПЕРЕДНЕЕ ОКНО

                </button>

                <button
                    class="powerChoice"
                    data-power="cameras">

                    ⚡ КАМЕРЫ

                </button>

                <button
                    class="powerChoice"
                    data-power="office">

                    ⚡ ОФИС

                </button>

            </div>


            <div id="powerProgress">

                <div id="powerProgressBar"></div>

            </div>

        </div>

    </div>


    <!-- =========================
         GAME OVER
    ========================== -->

    <div id="gameOver"
         class="overlay hidden">

        <h1>
            ТЫ ПРОИГРАЛ
        </h1>

        <p id="loseReason">
            ПАНКЕЙК ДОБРАЛСЯ ДО ОКНА.
        </p>

        <button id="restart">
            ПОВТОРИТЬ
        </button>

        <button id="menuAfterLose">
            МЕНЮ
        </button>

    </div>


    <!-- =========================
         ПОБЕДА
    ========================== -->

    <div id="winScreen"
         class="overlay hidden">

        <h1 id="winText">
            NIGHT 1 COMPLETE
        </h1>

        <button id="nextNight">
            СЛЕДУЮЩАЯ НОЧЬ
        </button>

        <button id="menuAfterWin">
            МЕНЮ
        </button>

    </div>

</div>


<!-- =========================
     ЗВУКИ
========================= -->

<audio id="phoneAudio"
       src="sounds/phone.mp3"></audio>

<audio id="humAudio"
       src="sounds/hum.mp3"
       loop></audio>

<audio id="flashAudio"
       src="sounds/flash.mp3"></audio>

<audio id="lichiAudio"
       src="sounds/lichi.mp3"></audio>

<audio id="pancakeAudio"
       src="sounds/pancake.mp3"></audio>

<audio id="screamAudio"
       src="sounds/scream.mp3"></audio>

<audio id="leverAudio"
       src="sounds/vent.mp3"></audio>


<script src="game.js"></script>

</body>
</html>

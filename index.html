<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Blood Glow Night</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     ГЛАВНОЕ МЕНЮ
========================= -->

<div id="mainMenu" class="screen">

    <div class="menuBox">

        <h1>BLOOD GLOW NIGHT</h1>

        <button id="startGameButton">
            NEW GAME
        </button>

        <button id="nightsButton">
            NIGHTS
        </button>

        <button id="settingsButton">
            SETTINGS
        </button>

    </div>

</div>


<!-- =========================
     ВЫБОР НОЧИ
========================= -->

<div id="nightsMenu" class="screen"
style="display:none;">

    <div class="menuBox">

        <h2>SELECT NIGHT</h2>

        <div id="nightsList"></div>

        <button id="closeNights">
            BACK
        </button>

    </div>

</div>


<!-- =========================
     НАСТРОЙКИ
========================= -->

<div id="settingsMenu" class="screen"
style="display:none;">

    <div class="menuBox">

        <h2>SETTINGS</h2>

        <button id="fullscreenButton">
            FULLSCREEN
        </button>

        <button id="resetProgress">
            RESET PROGRESS
        </button>

        <button id="closeSettings">
            BACK
        </button>

    </div>

</div>


<!-- =========================
     ЗВОНОК
========================= -->

<div id="phoneScreen"
class="screen"
style="display:none;">

    <div class="phoneBox">

        <h2>12:00 AM</h2>

        <p>
            Входящий звонок...
        </p>

        <button id="skipPhoneButton">
            ПРОПУСТИТЬ ЗВОНОК
        </button>

    </div>

</div>


<!-- =========================
     ИГРА
========================= -->

<div id="game"
style="display:none;">

    <div id="hud">

        <div id="night">
            NIGHT 1
        </div>

        <div id="time">
            12:00 AM
        </div>

    </div>


    <!-- ОФИС -->

    <div id="view">

        <img
            id="lichi"
            src="images/lichi.png"
            alt="Lichi"
        >

        <div id="flash"></div>

    </div>


    <div id="status">
        ОФИС
    </div>


    <!-- ПОВОРОТЫ -->

    <div id="officeControls">

        <button id="leftButton">
            ◀
            <span>ЛЕВО</span>
        </button>

        <button id="frontButton">
            ▲
            <span>ЦЕНТР</span>
        </button>

        <button id="rightButton">
            ▶
            <span>ПРАВО</span>
        </button>

    </div>


    <!-- НИЖНИЕ КНОПКИ -->

    <div id="bottomControls">

        <button id="cameraButton">
            МОНИТОР
        </button>

        <button id="flashButton">
            ВСПЫШКА
        </button>

    </div>


    <!-- =========================
         МОНИТОР
    ========================== -->

    <div id="cameraPanel">

        <div id="cameraTop">

            <button id="cameraTabButton">
                КАМЕРЫ
            </button>

            <button id="ventTabButton">
                ВЕНТИЛЯЦИЯ
            </button>

            <button id="closeCameraPanel">
                ▼ ОПУСТИТЬ
            </button>

        </div>


        <!-- =====================
             КАМЕРЫ
        ====================== -->

        <div id="cameraContent">

            <div id="cameraScreen">

                <div id="cameraScreenImage"></div>

                <div id="cameraScreenName">
                    CAM 01
                </div>

                <img
                    id="cameraLichi"
                    src="images/lichi.png"
                    alt="Lichi"
                >

            </div>


            <div id="cameraList">

                <button data-camera="cam01">
                    CAM 01
                </button>

                <button data-camera="cam02">
                    CAM 02
                </button>

                <button data-camera="cam03">
                    CAM 03
                </button>

                <button data-camera="cam04">
                    CAM 04
                </button>

                <button data-camera="cam05">
                    CAM 05
                </button>

                <button data-camera="cam06">
                    CAM 06
                </button>

                <button data-camera="cam07">
                    CAM 07
                </button>

            </div>

        </div>


        <!-- =====================
             ВЕНТИЛЯЦИЯ
        ====================== -->

        <div id="ventContent">

            <div id="ventMap">

                <div class="ventPoint"
                     id="vent1">
                    V-01
                </div>

                <div class="ventPoint"
                     id="vent2">
                    V-02
                </div>

                <div class="ventPoint"
                     id="vent3">
                    V-03
                </div>

                <div class="ventPoint"
                     id="vent4">
                    V-04
                </div>

                <div class="ventPoint"
                     id="ventOffice">
                    OFFICE
                </div>

            </div>

            <div id="ventStatus">
                ВЕНТИЛЯЦИЯ РАБОТАЕТ
            </div>

        </div>

    </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver"
class="screen"
style="display:none;">

    <div class="gameOverBox">

        <h1>GAME OVER</h1>

        <p>
            Личи добралась до офиса.
        </p>

        <button id="restart">
            RESTART
        </button>

        <button id="menuAfterLose">
            MENU
        </button>

    </div>

</div>


<!-- =========================
     ПОБЕДА
========================= -->

<div id="winScreen"
class="screen"
style="display:none;">

    <div class="gameOverBox">

        <h1 id="winText">
            NIGHT COMPLETE
        </h1>

        <button id="nextNight">
            NEXT NIGHT
        </button>

        <button id="menuAfterWin">
            MENU
        </button>

    </div>

</div>


<!-- =========================
     ЗВУКИ
========================= -->

<audio
id="phoneAudio"
src="sounds/phone.mp3"
preload="auto">
</audio>

<audio
id="flashAudio"
src="sounds/flash.mp3"
preload="auto">
</audio>

<audio
id="lichiAudio"
src="sounds/lichi.mp3"
preload="auto">
</audio>

<audio
id="humAudio"
src="sounds/hum.mp3"
preload="auto"
loop>
</audio>


<script src="game.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Blood Glow Night</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     ГЛАВНОЕ МЕНЮ
========================= -->

<div id="mainMenu" class="screen">

    <div class="menuBackground"></div>

    <div class="menuContent">

        <h1>BLOOD GLOW NIGHT</h1>

        <button id="startGameButton">
            НОВАЯ НОЧЬ
        </button>

        <button id="nightsButton">
            НОЧИ
        </button>

        <button id="settingsButton">
            НАСТРОЙКИ
        </button>

    </div>

</div>


<!-- =========================
     ВЫБОР НОЧИ
========================= -->

<div id="nightsMenu"
     class="screen hidden">

    <div class="menuContent">

        <h2>ВЫБОР НОЧИ</h2>

        <div id="nightsList"></div>

        <button id="closeNights">
            НАЗАД
        </button>

    </div>

</div>


<!-- =========================
     НАСТРОЙКИ
========================= -->

<div id="settingsMenu"
     class="screen hidden">

    <div class="menuContent">

        <h2>НАСТРОЙКИ</h2>

        <button id="fullscreenButton">
            ПОЛНЫЙ ЭКРАН
        </button>

        <button id="resetProgress">
            СБРОСИТЬ ПРОГРЕСС
        </button>

        <button id="closeSettings">
            НАЗАД
        </button>

    </div>

</div>


<!-- =========================
     ТЕЛЕФОННЫЙ ЗВОНОК
========================= -->

<div id="phoneScreen"
     class="screen hidden">

    <div class="phoneBox">

        <h2 id="phoneNight">
            NIGHT 2
        </h2>

        <p>
            Входящий звонок...
        </p>

        <button id="skipPhoneButton">
            ПРОПУСТИТЬ ЗВОНОК
        </button>

    </div>

</div>


<!-- =========================
     ИГРА
========================= -->

<div id="game"
     class="hidden">

    <div id="background"></div>

    <div id="view">

        <img id="lichi"
             src="images/lichi.png"
             alt="Личи">

        <img id="pancake"
             src="images/pancake.png"
             alt="Панкейк">

        <div id="flash"></div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div id="night">
            NIGHT 2
        </div>

        <div id="time">
            12:00 AM
        </div>

    </div>


    <div id="status">
        ОФИС
    </div>


    <!-- ПОВОРОТЫ -->

    <div id="officeControls">

        <button id="leftButton">
            ◀
        </button>

        <button id="frontButton">
            ●
        </button>

        <button id="rightButton">
            ▶
        </button>

    </div>


    <!-- НИЖНИЕ КНОПКИ -->

    <div id="bottomControls">

        <button id="cameraButton">
            КАМЕРЫ
        </button>

        <button id="ventButton">
            ВЕНТИЛЯЦИЯ
        </button>

        <button id="flashButton">
            ВСПЫШКА
        </button>

    </div>


    <!-- =========================
         КАМЕРЫ
    ========================== -->

    <div id="cameraPanel"
         class="panel hidden">

        <div class="panelHeader">

            <span>
                СИСТЕМА КАМЕР
            </span>

            <button id="closeCameraPanel">
                ✕
            </button>

        </div>


        <div id="cameraImage">

            <div id="cameraStatic"></div>

            <div id="cameraNumber">
                CAM 01
            </div>

            <img id="cameraLichi"
                 src="images/lichi.png">

            <img id="cameraPancake"
                 src="images/pancake.png">

        </div>


        <!-- ПРОКРУЧИВАЕМАЯ ПАНЕЛЬ -->

        <div id="cameraMap">

            <button data-camera="cam01">
                CAM 01
            </button>

            <button data-camera="cam02">
                CAM 02
            </button>

            <button data-camera="cam03">
                CAM 03
            </button>

            <button data-camera="cam04">
                CAM 04
            </button>

            <button data-camera="cam05">
                CAM 05
            </button>

            <button data-camera="cam06">
                CAM 06
            </button>

            <button data-camera="cam07">
                CAM 07
            </button>

            <button data-camera="cam08">
                CAM 08
            </button>

        </div>

    </div>


    <!-- =========================
         ВЕНТИЛЯЦИЯ
    ========================== -->

    <div id="ventPanel"
         class="panel hidden">

        <div class="panelHeader">

            <span>
                СИСТЕМА ВЕНТИЛЯЦИИ
            </span>

            <button id="closeVentPanel">
                ✕
            </button>

        </div>


        <div id="ventMap">

            <div class="ventRoom officeVent">
                ОФИС
            </div>

            <div class="ventRoom room1">
                V1
            </div>

            <div class="ventRoom room2">
                V2
            </div>

            <div class="ventRoom room3">
                V3
            </div>

            <div class="ventRoom room4">
                V4
            </div>

            <div class="ventRoom room5">
                V5
            </div>


            <div class="ventLine line1"></div>
            <div class="ventLine line2"></div>
            <div class="ventLine line3"></div>
            <div class="ventLine line4"></div>
            <div class="ventLine line5"></div>


            <button class="ventDoor door1"
                    data-door="1">
                ПЕРЕГОРОДКА 1
            </button>

            <button class="ventDoor door2"
                    data-door="2">
                ПЕРЕГОРОДКА 2
            </button>

            <button class="ventDoor door3"
                    data-door="3">
                ПЕРЕГОРОДКА 3
            </button>

            <button class="ventDoor door4"
                    data-door="4">
                ПЕРЕГОРОДКА 4
            </button>

            <button class="ventDoor door5"
                    data-door="5">
                ПЕРЕГОРОДКА 5
            </button>


            <div id="pancakeVent">
                ПАНКЕЙК
            </div>

        </div>


        <div id="ventStatus">
            ВЕНТИЛЯЦИЯ НОРМАЛЬНА
        </div>

    </div>


    <!-- =========================
         GAME OVER
    ========================== -->

    <div id="gameOver"
         class="overlay hidden">

        <h1>
            ТЫ ПРОИГРАЛ
        </h1>

        <button id="restart">
            ПОВТОРИТЬ
        </button>

        <button id="menuAfterLose">
            МЕНЮ
        </button>

    </div>


    <!-- =========================
         ПОБЕДА
    ========================== -->

    <div id="winScreen"
         class="overlay hidden">

        <h1 id="winText">
            NIGHT 2 COMPLETE
        </h1>

        <button id="nextNight">
            СЛЕДУЮЩАЯ НОЧЬ
        </button>

        <button id="menuAfterWin">
            МЕНЮ
        </button>

    </div>

</div>


<!-- =========================
     ЗВУКИ
========================= -->

<audio id="phoneAudio"
       src="sounds/phone.mp3"></audio>

<audio id="humAudio"
       src="sounds/hum.mp3"
       loop></audio>

<audio id="flashAudio"
       src="sounds/flash.mp3"></audio>

<audio id="lichiAudio"
       src="sounds/lichi.mp3"></audio>

<audio id="pancakeAudio"
       src="sounds/pancake.mp3"></audio>

<audio id="screamAudio"
       src="sounds/scream.mp3"></audio>

<audio id="ventAudio"
       src="sounds/vent.mp3"
       loop></audio>


<script src="game.js"></script>

</body>
</html>

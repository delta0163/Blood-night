<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Blood Glow Night</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="rotateMessage">
    <div>
        <h1>Blood Glow Night</h1>
        <p>Поверните телефон горизонтально</p>
        <div class="rotateIcon">⟳</div>
    </div>
</div>


<div id="game">

    <!-- ОСНОВНОЙ ЭКРАН -->

    <div id="view"></div>

    <!-- СПРАЙТ ЛИЧИ -->

    <img
        id="lichi"
        src="images/lichi.png"
        alt="Личи"
    >


    <!-- ЗАТЕМНЕНИЕ -->

    <div id="darkness"></div>


    <!-- ВЕРХНИЙ ИНТЕРФЕЙС -->

    <div id="time">
        12:00 AM
    </div>

    <div id="night">
        NIGHT 1 — DEMO
    </div>

    <div id="status">
        Личи находится далеко.
    </div>


    <!-- ПОЛНЫЙ ЭКРАН -->

    <button
        id="fullscreenButton"
        class="topButton"
    >
        ⛶
    </button>


    <!-- ПОВОРОТЫ -->

    <div id="direction">

        <button
            class="directionButton"
            id="leftButton"
        >
            ◀
        </button>

        <button
            class="directionButton"
            id="frontButton"
        >
            ▲
        </button>

        <button
            class="directionButton"
            id="rightButton"
        >
            ▶
        </button>

    </div>


    <!-- ВСПЫШКА -->

    <button
        id="flashButton"
        class="controlButton"
    >
        📷 ВСПЫШКА
    </button>


    <!-- ВСПЫШКА ЭКРАНА -->

    <div id="flash"></div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <h1>GAME OVER</h1>

        <p>
            Личи добралась до офиса.
        </p>

        <button id="restart">
            НАЧАТЬ ЗАНОВО
        </button>

    </div>


    <!-- ПОБЕДА -->

    <div id="winScreen">

        <h1>6:00 AM</h1>

        <p>
            NIGHT 1 COMPLETE
        </p>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
